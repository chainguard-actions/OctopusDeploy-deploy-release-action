name: Test env-var config with unreachable server fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: http://127.0.0.1:1
      OCTOPUS_API_KEY: API-FAKEKEY0000000000000000000
      OCTOPUS_SPACE: Default
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: MyProject
          release_number: 1.0.0
          environments: |
            Dev
            Staging
          use_guided_failure: "true"
          variables: |
            Foo:Bar
            Baz:Qux
      - name: Assert action failed with no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.server_tasks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when Octopus server is unreachable"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no server_tasks output"
            exit 1
          fi
          echo "PASS"
