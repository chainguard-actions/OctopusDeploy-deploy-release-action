name: Test invalid deploy_at fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: MyProject
          release_number: 1.0.0
          environments: |
            Dev
          server: http://127.0.0.1:9/
          api_key: API-TESTKEY000000000000000000
          space: Default
          deploy_at: not-a-date
      - name: Assert action failed and produced no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.server_tasks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid deploy_at"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no server_tasks output"
            exit 1
          fi
          echo "PASS"
