name: Test unreachable server fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        env:
          OCTOPUS_URL: http://127.0.0.1:9/
          OCTOPUS_API_KEY: API-TESTKEY000000000000000000
          OCTOPUS_SPACE: Default
        with:
          project: MyProject
          release_number: 1.0.0
          environments: |
            Dev
            Staging
          variables: |
            Foo:Bar
          use_guided_failure: "true"
          deploy_at: 2030-04-01T09:00:00+10:00
          deploy_at_expiry: 2030-04-01T10:00:00+10:00
      - name: Assert action failed on connection and produced no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.server_tasks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when Octopus server is unreachable"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no server_tasks output"
            exit 1
          fi
          echo "PASS"
