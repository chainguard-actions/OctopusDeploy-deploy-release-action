name: Test invalid deploy_at_expiry fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: MyProject
          release_number: 1.0.0
          environments: |
            Dev
          server: http://127.0.0.1:1
          api_key: API-FAKEKEY0000000000000000000
          space: Default
          deploy_at: 2026-04-01T09:00:00+10:00
          deploy_at_expiry: 2026-13-45T99:99:99
      - name: Assert action failed with no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.server_tasks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid deploy_at_expiry"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no server_tasks output"
            exit 1
          fi
          echo "PASS"
