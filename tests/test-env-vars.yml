name: Test env var configuration - OCTOPUS_URL, OCTOPUS_API_KEY, OCTOPUS_SPACE
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: "https://octopus.example.com/"
      OCTOPUS_API_KEY: "API-FAKE000000000000000000000000000"
      OCTOPUS_SPACE: "Default"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: "MyProject"
          release_number: "1.0.0"
          environments: "Development"

      - name: Assert action ran and failed gracefully (no real Octopus server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SERVER_TASKS: ${{ steps.action.outputs.server_tasks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "server_tasks: $SERVER_TASKS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SERVER_TASKS" ]; then
              echo "FAIL: action succeeded but server_tasks output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with server_tasks: $SERVER_TASKS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Octopus Deploy server available via env vars)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
