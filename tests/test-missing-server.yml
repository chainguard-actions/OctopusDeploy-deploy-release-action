name: Test missing server fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: MyProject
          release_number: 1.0.0
          environments: |
            Dev
          api_key: API-FAKEKEY0000000000000000000
          space: Default
      - name: Assert action failed with no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.server_tasks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server is missing"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no server_tasks output"
            exit 1
          fi
          echo "PASS"
